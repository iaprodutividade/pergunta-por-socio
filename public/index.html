<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Pergunta por sócio</title>
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="tela">
    <header class="topo">
      <span class="marca">Mural Financeiro</span>
      <span id="nomeSocio" class="nome-socio"></span>
    </header>

    <main class="centro">
      <button id="botaoMic" class="botao-mic" aria-label="Falar pergunta">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
      <p id="status" class="status">Toque no microfone e pergunte qualquer coisa sobre sua empresa</p>
    </main>

    <section id="cartaoResposta" class="cartao-resposta oculto">
      <p class="pergunta-transcrita" id="perguntaTexto"></p>
      <p class="resposta-texto" id="respostaTexto"></p>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
