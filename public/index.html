<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>Pergunta por sócio</title>
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script>
  try {
    var t = localStorage.getItem('tema');
    if (t === 'claro' || t === 'intermediario') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
  <div class="fundo-ambiente"><div class="mancha-ambar"></div><div class="grade-ambiente"></div></div>
  <div class="tela">
    <header class="topo">
      <div class="avatar" id="avatar">?</div>
      <div class="topo-textos">
        <p class="rotulo-topo">Mural Financeiro</p>
        <p class="titulo-topo" id="tituloTopo">Olá</p>
      </div>
      <div class="topo-acoes">
        <button class="botao-tema" data-tema="claro" aria-label="Tema claro" title="Tema claro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="botao-tema" data-tema="intermediario" aria-label="Tema intermediário" title="Tema intermediário">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="botao-tema" data-tema="escuro" aria-label="Tema escuro" title="Tema escuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </header>

    <a id="linkHistoricoAceites" class="botao-historico" href="#" target="_blank" rel="noopener" style="width:100%; margin-bottom:20px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Histórico de aceites</span>
    </a>

    <p class="secao-rotulo">Suas empresas</p>
    <div class="grid-empresas" id="gridEmpresas"></div>

    <p class="secao-rotulo">Perguntar</p>
    <div class="card-mic">
      <button id="botaoMic" class="icone-selo azul-grande" style="border:none;cursor:pointer" aria-label="Falar pergunta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
      <p id="status" class="status">Toque no microfone e pergunte qualquer coisa sobre sua empresa</p>
    </div>

    <p class="secao-rotulo">Última resposta</p>
    <section id="cartaoResposta" class="card-resposta oculto">
      <p class="pergunta-transcrita" id="perguntaTexto"></p>
      <p class="resposta-texto" id="respostaTexto"></p>
      <button id="botaoOuvir" class="botao-ouvir" type="button">
        <svg class="icone-ouvir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <svg class="icone-parar oculto" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span id="textoBotaoOuvir">Ouvir</span>
      </button>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
